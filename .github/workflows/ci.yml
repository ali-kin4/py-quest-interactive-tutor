name: PyQuest quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests, solutions and lesson examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12' # matches the Pyodide 0.27 runtime used in the browser
      - name: Unit tests
        run: npm test
      - name: Grade every reference solution with the real harness
        run: npm run verify:solutions
      - name: Run every lesson example and check its documented output
        run: npm run verify:lessons

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke test
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyquest-screenshots
          path: screenshots/
          if-no-files-found: ignore
