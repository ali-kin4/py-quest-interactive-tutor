name: Bug report
description: Something in the app doesn't work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! For security problems, please use **Security → Report a vulnerability** instead of an issue.
  - type: input
    id: where
    attributes:
      label: Page or URL
      description: For example `#/practice/two-sum` or `#/learn/loops`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Paste this code …
        3. Press Run code
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code you ran (if relevant)
      render: python
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Windows 11
    validations:
      required: true
